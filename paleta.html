<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/paleta.css">
        <title>Paleta de cores</title>
    </head>
    <body>
       
        <h1>Paleta de cores</h1>

        <!-- Apresentação centralizada das cores da identidade visual. -->
        <ul class="paleta">
            <li class="cor-ciano-acinzentado">
                <p>Ciano acinzentado</p>
                <p>#060909;</p>
            </li>
            <li class="cor-azul-acinzentado">
                <p>Azul acinzentado</p>
                <p>#121417;</p>
            </li>
             <li class="cor-cinza-escuro">
                <p>Cinza escuro</p>
                <p>#1E2124;</p>
            </li>
            <li class="cor-cinza">
                <p>Cinza</p>
                <p>#676e76;</p>
            </li>
            <li class="cor-cinza-claro">
                <p>Cinza claro</p>
                <p>#c8c8c9;</p>
            </li>
            <li class="cor-branco-gelo">
                <p>Branco gelo</p>
                <p>#f8f8f8;</p>
            </li>
            <li class="cor-azul">
                <p>Azul</p>
                <p>#085ccd</p>
            </li>
            <li class="cor-azul-claro">
                <p>Azul claro</p>
                <p>#4892f3</p>
            </li>
            
        </ul>
    </body>
</html>
